; CLI configuration for the local Laravel API.
; extension_dir is generated by runtime.ps1 for the selected PHP executable.
extension=curl
extension=fileinfo
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=gd
extension=zip
date.timezone=Asia/Jakarta
memory_limit=512M
max_execution_time=120
error_reporting=E_ALL
display_errors=Off
log_errors=On
